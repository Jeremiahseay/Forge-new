<head>

<body>
<div id="app">
<header class="topbar"><div><div class="eyebrow">FORGE FITNESS</div><h1 id="pageTitle">Today</h1></div><select id="profileSelect" aria-label="Active profile"><option value="me">Me</option><option value="fiancee">Fiancée</option></select></header>

<script>
(async()=>{try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();}if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}}catch(e){console.warn("cache cleanup",e)}})();
</script><script src="data.js"></script><script src="app.js"></script>
